name: release

# release-please maintains a release PR from the conventional-commit history;
# merging it tags the release and triggers the image build below. Renovate in
# the homelab repo then sees the new GHCR tag and opens the deploy bump.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          # A PR opened with GITHUB_TOKEN gets no CI run until someone approves
          # it by hand, and the release PR has required checks. This token opens
          # it as a user instead. Without the secret it falls back to
          # GITHUB_TOKEN and the old behaviour.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Cluster and runner are both amd64, so a single-platform build is enough.
      # `target` is required, not optional: the bridge stage is last in the
      # Dockerfile, so an untargeted build silently tags it as the relay.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: relay
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cosmicspork/pager:${{ needs.release-please.outputs.version }}
            ghcr.io/cosmicspork/pager:latest
          # Each image keeps its own cache. Sharing the default scope meant each
          # build overwrote the other's cache index.
          cache-from: type=gha,scope=pager
          cache-to: type=gha,mode=max,scope=pager
      # The bridge, for running one in the cluster as well as on a laptop.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: bridge
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cosmicspork/pager-bridge:${{ needs.release-please.outputs.version }}
            ghcr.io/cosmicspork/pager-bridge:latest
          cache-from: type=gha,scope=pager-bridge
          cache-to: type=gha,mode=max,scope=pager-bridge
      # Each image must carry its own binary and not the other's. A mislabelled
      # image is not a build failure — it crash-loops in the cluster instead.
      - name: assert each image carries the right binary
        run: |
          v=${{ needs.release-please.outputs.version }}
          docker run --rm --entrypoint /bin/sh ghcr.io/cosmicspork/pager:$v -c \
            'test -x /usr/local/bin/pager-relay && ! test -e /usr/local/bin/pager-bridge'
          docker run --rm --entrypoint /bin/sh ghcr.io/cosmicspork/pager-bridge:$v -c \
            'test -x /usr/local/bin/pager-bridge && ! test -e /usr/local/bin/pager-relay'
