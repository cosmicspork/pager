name: release

# release-please maintains a release PR from the conventional-commit history;
# merging it tags the release and triggers the image build below. Renovate in
# the homelab repo then sees the new GHCR tag and opens the deploy bump.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Cluster and runner are both amd64, so a single-platform build is enough.
      # `target` is required, not optional: the bridge stage is last in the
      # Dockerfile, so an untargeted build silently tags it as the relay.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: relay
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cosmicspork/pager:${{ needs.release-please.outputs.version }}
            ghcr.io/cosmicspork/pager:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The bridge, for running one in the cluster as well as on a laptop.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: bridge
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cosmicspork/pager-bridge:${{ needs.release-please.outputs.version }}
            ghcr.io/cosmicspork/pager-bridge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Each image must carry its own binary and not the other's. A mislabelled
      # image is not a build failure — it crash-loops in the cluster instead.
      - name: assert each image carries the right binary
        run: |
          v=${{ needs.release-please.outputs.version }}
          docker run --rm --entrypoint /bin/sh ghcr.io/cosmicspork/pager:$v -c \
            'test -x /usr/local/bin/pager-relay && ! test -e /usr/local/bin/pager-bridge'
          docker run --rm --entrypoint /bin/sh ghcr.io/cosmicspork/pager-bridge:$v -c \
            'test -x /usr/local/bin/pager-bridge && ! test -e /usr/local/bin/pager-relay'
