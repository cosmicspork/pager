<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pager</title>
  <link rel="stylesheet" href="ui.css" />
  <style>body { width: 300px; }</style>
</head>
<body>
  <h1>Pager</h1>
  <p class="sub">capture, paging &amp; Teams activity</p>

  <h2>Capture</h2>
  <div class="row">
    <label for="captureTeams"><span class="name">Teams</span></label>
    <input type="checkbox" id="captureTeams" />
  </div>
  <div class="row">
    <label for="captureOutlook"><span class="name">Outlook</span></label>
    <input type="checkbox" id="captureOutlook" />
  </div>

  <h2>Paging</h2>
  <div class="field">
    <label for="pagingMode"><span class="name">Phone notifications</span></label>
    <select id="pagingMode">
      <option value="scheduled">Scheduled</option>
      <option value="always_notify">Always notify</option>
      <option value="always_silent">Always silent</option>
    </select>
    <span class="hint" id="pagingState"></span>
  </div>

  <h2>Teams activity</h2>
  <div class="field">
    <label for="keepActiveMode"><span class="name">Keep Teams active</span></label>
    <select id="keepActiveMode">
      <option value="scheduled">Scheduled</option>
      <option value="always_on">Always on</option>
      <option value="always_off">Always off</option>
    </select>
    <span class="hint" id="activityState"></span>
  </div>

  <div class="status">
    <div><span>collector</span><span class="val" id="stCollector">—</span></div>
    <div><span>pending</span><span class="val" id="stPending">—</span></div>
    <div><span>teams capture</span><span class="val" id="stTeams">—</span></div>
    <div><span>outlook capture</span><span class="val" id="stOutlook">—</span></div>
    <div><span>last archive</span><span class="val" id="stLast">—</span></div>
  </div>

  <div class="footer">
    <button id="options">Settings</button>
    <span class="saved" id="saved">saved</span>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
