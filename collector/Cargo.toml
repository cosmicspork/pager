[package]
name = "pager-collector"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "pager_collector"
path = "src/lib.rs"

[[bin]]
name = "pager-collector"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
hex = { workspace = true }
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "server", "macros", "schemars", "transport-io"] }
